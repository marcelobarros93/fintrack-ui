<section class="edit-screen expense-edit">
  <div class="edit-card">
    <header class="edit-card-header">
      <h1>{{ pageTitle }}</h1>
      <span class="edit-status-pill" [ngClass]="statusClass">{{
        statusLabel
      }}</span>
    </header>

    <form
      #expenseForm="ngForm"
      class="edit-form"
      autocomplete="off"
      (ngSubmit)="save()"
    >
      <div class="edit-grid full">
        <label for="description">Descrição</label>
        <input
          pInputText
          [(ngModel)]="expense.description"
          required
          minlength="3"
          maxlength="100"
          type="text"
          name="description"
          #description="ngModel"
          class="w-full"
        />
        <app-input-message
          [control]="description.control"
          error="required"
          text="Descrição obrigatoria"
        ></app-input-message>
        <app-input-message
          [control]="description.control"
          error="minlength"
          text="Descrição deve ter no minimo 3 caracteres"
        ></app-input-message>
        <app-input-message
          [control]="description.control"
          error="maxlength"
          text="Descrição deve ter no maximo 100 caracteres"
        ></app-input-message>
      </div>

      <div class="edit-grid two-cols">
        <div>
          <label for="amount">Valor</label>
          <p-inputNumber
            [(ngModel)]="expense.amount"
            mode="currency"
            currency="BRL"
            name="amount"
            #amount="ngModel"
            class="w-full"
            [required]="true"
          ></p-inputNumber>
          <app-input-message
            [control]="amount.control"
            error="required"
            text="Valor obrigatorio"
          ></app-input-message>
        </div>

        <div>
          <label for="category">Categoria</label>
          <p-dropdown
            [options]="categories"
            [(ngModel)]="expense.categoryId"
            optionLabel="name"
            optionValue="id"
            name="categoryId"
            placeholder="Selecione a categoria"
            [filter]="true"
            filterBy="name"
            [showClear]="true"
          ></p-dropdown>
        </div>
      </div>

      <div class="edit-grid two-cols">
        <div>
          <label for="dateDue">Data de vencimento</label>
          <p-calendar
            [(ngModel)]="expense.dateDue"
            dateFormat="dd/mm/yy"
            [touchUI]="false"
            [readonlyInput]="true"
            name="dateDue"
            #dateDue="ngModel"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [showButtonBar]="true"
            [required]="true"
          ></p-calendar>
          <app-input-message
            [control]="dateDue.control"
            error="required"
            text="Data de vencimento obrigatoria"
          ></app-input-message>
        </div>

        <div *ngIf="isPaid()">
          <label for="datePayment">Data de pagamento</label>
          <p-calendar
            [(ngModel)]="expense.datePayment"
            dateFormat="dd/mm/yy"
            [showTime]="true"
            name="datePayment"
            #datePayment="ngModel"
            [required]="true"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [showButtonBar]="true"
          ></p-calendar>
          <app-input-message
            [control]="datePayment.control"
            error="required"
            text="Data de pagamento obrigatoria"
          ></app-input-message>
        </div>
      </div>

      <footer class="edit-card-footer">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-outlined"
          [routerLink]="['/expense']"
        ></button>

        <div class="footer-main-actions">
          <button
            pButton
            type="submit"
            icon="pi pi-check"
            label="Salvar"
            [disabled]="!expenseForm.valid"
          ></button>
          <button
            pButton
            type="button"
            icon="pi pi-wallet"
            label="Marcar como pago"
            class="p-button-outlined"
            *ngIf="isPayable()"
            (click)="pay()"
          ></button>
          <button
            pButton
            type="button"
            icon="pi pi-undo"
            label="Cancelar pagamento"
            class="p-button-outlined"
            *ngIf="isCancelable()"
            (click)="cancelPayment()"
          ></button>
        </div>
      </footer>
    </form>
  </div>
</section>
