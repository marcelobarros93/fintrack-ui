<section class="edit-screen planning-edit">
  <div class="edit-card">
    <header class="edit-card-header">
      <h1>{{ pageTitle }}</h1>
      <span class="edit-status-pill" [ngClass]="statusClass">{{
        statusLabel
      }}</span>
    </header>

    <form
      [formGroup]="planningForm"
      class="edit-form"
      autocomplete="off"
      (ngSubmit)="save()"
    >
      <div class="edit-grid full">
        <label for="description">Descrição</label>
        <input
          formControlName="description"
          pInputText
          type="text"
          name="description"
          class="w-full"
        />
        <app-input-message
          [control]="planningForm.get('description')"
          error="required"
          text="Descrição obrigatoria"
        ></app-input-message>
        <app-input-message
          [control]="planningForm.get('description')"
          error="minlength"
          text="Descrição deve ter no minimo 3 caracteres"
        ></app-input-message>
        <app-input-message
          [control]="planningForm.get('description')"
          error="maxlength"
          text="Descrição deve ter no maximo 100 caracteres"
        ></app-input-message>
      </div>

      <div class="edit-grid two-cols">
        <div>
          <label for="amount">Valor</label>
          <p-inputNumber
            formControlName="amount"
            mode="currency"
            currency="BRL"
            name="amount"
            class="w-full"
          ></p-inputNumber>
          <app-input-message
            [control]="planningForm.get('amount')"
            error="required"
            text="Valor obrigatorio"
          ></app-input-message>
          <app-input-message
            [control]="planningForm.get('amount')"
            error="min"
            text="Valor deve ser maior que zero"
          ></app-input-message>
        </div>

        <div>
          <label for="type">Tipo</label>
          <p-selectButton
            formControlName="type"
            [options]="typeOptions"
            [multiple]="false"
            optionLabel="label"
            optionValue="value"
            name="type"
          ></p-selectButton>
          <app-input-message
            [control]="planningForm.get('type')"
            error="required"
            text="Tipo obrigatorio"
          ></app-input-message>
        </div>
      </div>

      <div class="edit-grid two-cols">
        <div>
          <label for="category">Categoria</label>
          <p-dropdown
            [options]="categories"
            formControlName="categoryId"
            optionLabel="name"
            optionValue="id"
            name="categoryId"
            placeholder="Selecione a categoria"
            [filter]="true"
            filterBy="name"
            [showClear]="true"
          ></p-dropdown>
        </div>

        <div>
          <label for="dueDay">Dia de vencimento</label>
          <input
            formControlName="dueDay"
            pInputText
            type="number"
            name="dueDay"
            class="w-full"
          />
          <app-input-message
            [control]="planningForm.get('dueDay')"
            error="required"
            text="Dia de vencimento obrigatorio"
          ></app-input-message>
          <app-input-message
            [control]="planningForm.get('dueDay')"
            error="min"
            text="Dia deve ser no minimo 1"
          ></app-input-message>
          <app-input-message
            [control]="planningForm.get('dueDay')"
            error="max"
            text="Dia deve ser no maximo 31"
          ></app-input-message>
        </div>
      </div>

      <div class="edit-grid two-cols">
        <div>
          <label for="startAt">Inicio</label>
          <p-calendar
            formControlName="startAt"
            dateFormat="mm/yy"
            view="month"
            name="startAt"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [showButtonBar]="true"
          ></p-calendar>
          <app-input-message
            [control]="planningForm.get('startAt')"
            error="required"
            text="Inicio obrigatorio"
          ></app-input-message>
        </div>

        <div>
          <label for="endAt">Fim</label>
          <p-calendar
            formControlName="endAt"
            dateFormat="mm/yy"
            view="month"
            name="endAt"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [showButtonBar]="true"
          ></p-calendar>
          <app-input-message
            [control]="planningForm.get('endAt')"
            error="required"
            text="Fim obrigatorio"
          ></app-input-message>
        </div>
      </div>

      <div class="edit-grid two-cols switch-grid">
        <div class="switch-field">
          <label for="active">Ativo</label>
          <p-inputSwitch formControlName="active" name="active"></p-inputSwitch>
        </div>

        <div class="switch-field">
          <label for="showInstallmentsInBillName"
            >Mostrar parcelas no nome da conta</label
          >
          <p-inputSwitch
            formControlName="showInstallmentsInBillName"
            name="showInstallmentsInBillName"
          ></p-inputSwitch>
        </div>
      </div>

      <footer class="edit-card-footer">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-outlined"
          [routerLink]="['/planning']"
        ></button>

        <div class="footer-main-actions">
          <button
            pButton
            type="submit"
            icon="pi pi-check"
            label="Salvar"
            [disabled]="planningForm.invalid"
          ></button>
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Novo"
            class="p-button-outlined"
            *ngIf="editing"
            [routerLink]="['/planning/new']"
          ></button>
        </div>
      </footer>
    </form>
  </div>
</section>
