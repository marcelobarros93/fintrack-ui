<section class="login-page">
  <aside class="login-hero">
    <div class="hero-brand">
      <span class="hero-logo-mark"><i class="pi pi-arrow-up-right"></i></span>
      <span class="hero-logo-text">FINTRACK</span>
    </div>

    <div class="hero-copy">
      <h1>Controle simples de receitas e despesas</h1>
      <p>Organize suas financas e acompanhe seu fluxo de caixa.</p>
    </div>

    <div class="hero-graphic" aria-hidden="true"></div>
  </aside>

  <main class="login-main">
    <div class="login-card">
      <header>
        <h2>Entrar no FINTRACK</h2>
        <p>Gerencie suas receitas e despesas</p>
      </header>

      <form class="login-form" autocomplete="off" (ngSubmit)="login()">
        <label for="email">Email</label>
        <div class="input-shell">
          <i class="pi pi-envelope"></i>
          <input
            id="email"
            type="email"
            placeholder="seuemail@dominio.com"
            pInputText
            [(ngModel)]="username"
            name="username"
            class="w-full"
            #email="ngModel"
            [required]="true"
            minlength="3"
          />
        </div>

        <label for="password">Senha</label>
        <p-password
          id="password"
          placeholder="Senha"
          [toggleMask]="true"
          [(ngModel)]="password"
          name="password"
          styleClass="w-full"
          inputStyleClass="w-full"
          [feedback]="false"
          [required]="true"
          [minlength]="6"
        ></p-password>

        <button
          pButton
          type="submit"
          label="Entrar"
          class="w-full login-submit"
          [disabled]="email.invalid || password.length < 6"
        ></button>
      </form>

      <button type="button" class="forgot-password">Esqueceu a senha?</button>
    </div>
  </main>
</section>
